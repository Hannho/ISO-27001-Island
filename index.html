<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ISO 27001 資安島｜資安與合規模擬器</title>
<link rel="stylesheet" href="style.css">
<script crossorigin="anonymous" src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script crossorigin="anonymous" src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script crossorigin="anonymous" src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
<!-- 登入視窗 -->
<div id="loginOverlay" style="position:fixed;inset:0;background:var(--panel);z-index:9999;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(10px);">
  <div style="background:var(--card-bg);padding:40px;border-radius:24px;box-shadow:0 20px 50px rgba(0,0,0,0.2);width:320px;text-align:center;border:1px solid var(--line);">
    <h2 style="margin:0 0 10px;font-size:24px;">資安島 登入</h2>
    <p style="margin:0 0 20px;color:var(--mute);font-size:13px;">ISO 27001 合規戰情室</p>
    <input id="loginUser" placeholder="帳號 (例: admin)" class="search" style="margin-bottom:10px;background:#fff;">
    <input id="loginPwd" type="password" placeholder="密碼 (例: 123)" class="search" style="margin-bottom:15px;background:#fff;" onkeydown="if(event.key==='Enter') doLogin()">
    <button class="sim-btn" style="position:static;width:100%;justify-content:center;padding:12px;" onclick="doLogin()">登入系統</button>
    <p id="loginErr" style="color:#ef4444;font-size:13px;margin-top:12px;display:none;font-weight:700;">帳號或密碼錯誤</p>
    <div style="margin-top:20px;font-size:12px;color:var(--mute);text-align:left;background:var(--soft);padding:12px;border-radius:12px;">
      <b style="color:var(--ink)">測試帳號 (密碼皆為 123)：</b><br>
      <div style="margin-top:6px; line-height:1.6">
        • <b>admin</b> (管理員：可編輯全部)<br>
        • <b>audit</b> (稽核員：僅可標記缺失)<br>
        • <b>user</b> (使用者：唯讀模式)
      </div>
    </div>
  </div>
</div>

<main class="app">
  <section id="stage">
    <div id="lab"></div>
    <header class="topbar">
    <div class="brand">
      <div class="big">ISO 27001<br>ISLAND.</div>
      <div><h1>資安合規防護網</h1><p><span>SIMULATOR</span> 資安導入模擬器</p></div>
    </div>
    <div class="tools">
      <button class="tb" id="home">↗ 全景</button>
      <button class="tb" id="courtBtn">🏛️ 驗證機構</button>
      <button class="tb" id="modeBtn">📊 認真模式</button>
      <button class="tb" id="menu">≡ 索引 / 進度</button>
    </div>
    <div class="hud">
      <div class="seg" id="tm">
        <button data-t="safe" class="safe on" title="合規安全"><i>🛡️</i>合規</button>
        <button data-t="flat" class="" title="營運中"><i>⚖️</i>營運</button>
        <button data-t="danger" class="danger" title="資安危機"><i>🚨</i>危機</button>
      </div>
      <div class="seg" id="tg">
        <button data-g="names" aria-pressed="true"><i>🏷️</i>標籤</button>
        <button data-g="walk" aria-pressed="false" id="walkBtn"><i>🚶</i>漫遊</button>
        <button data-g="bird" aria-pressed="false"><i>🦅</i>鳥瞰</button>
      </div>
    </div>
    </header>
    <div class="tracker">
      <div class="tr-top"><b id="monthLabel">模擬演練：第 1 個月</b><span id="scoreLabel">分數: 60</span></div>
      <div class="tr-bar"><div id="tr-fill" style="width: 8%;"></div></div>
      <div style="font-size:11px; color:#cbd5e1; margin-top:5px;" id="statusLabel">狀態：專案啟動 (Kick-off)</div>
      <div style="font-size:12px; font-weight:700; color:#93c5fd; margin:12px 0 5px;" id="realLabel">輔導完成度：0/109 項（0%）</div>
      <div class="tr-bar"><div id="tr-fill2" style="background:#3b82f6; height:100%; width:0%; transition:width .4s;"></div></div>
    </div>
    <button class="sim-btn" id="nextTurnBtn"><i>⏳</i> 推進模擬 (Next Month)</button>
    <article id="card" hidden>
      <button id="cx" aria-label="關閉">×</button>
      <div id="cc"></div>
    </article>
  </section>
  <aside id="sb" aria-label="資安案例清單"></aside>
</main>

<script src="script.js"></script>
</body>
</html>
