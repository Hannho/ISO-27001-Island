<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ISO 27001 資安島｜資安與合規模擬器</title>
<script crossorigin="anonymous" src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root {
  --panel: rgba(253, 251, 247, 0.96); --panel-solid: #fdfbf7; --ink: #111827; --mute: #4b5563;
  --line: #e5e7eb; --acc: #10b981; --hot: #f59e0b; --soft: #f3f4f6; --card-bg: rgba(255, 255, 255, 0.9);
  color-scheme: light; box-sizing: border-box;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --panel: rgba(17, 24, 39, 0.94); --panel-solid: #111827; --ink: #f9fafb; --mute: #9ca3af;
    --line: #374151; --acc: #10b981; --hot: #fbbf24; --soft: #1f2937; --card-bg: rgba(31, 41, 55, 0.9);
    color-scheme: dark;
  }
}
html { height: 100%; }
body { margin: 0; height: 100%; background: var(--panel-solid); color: var(--ink); font: 14px/1.65 "PingFang TC", "Noto Sans TC", sans-serif; overflow: hidden; }
button { font: inherit; color: inherit; transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
.app { display: grid; grid-template-columns: minmax(0, 1fr) 390px; height: 100%; }
#stage { position: relative; min-width: 0; overflow: hidden; background: #38bdf8; }
#stage canvas { display: block; outline: none; }
#lab { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
#lab > * { position: absolute; left: 0; top: 0; pointer-events: auto; white-space: nowrap; border: 0; transform: translate(-50%, -50%); transition: transform 0.2s, box-shadow 0.2s; }

.il { cursor: pointer; background: var(--card-bg); backdrop-filter: blur(8px); color: var(--ink); border-radius: 99px; padding: 6px 14px; font-size: 12px; font-weight: 800; box-shadow: 0 4px 20px rgba(0,0,0,0.15), 0 0 0 1px rgba(255,255,255,0.4); display: inline-flex; align-items: center; gap: 6px; }
.il:hover { transform: translate(-50%, -55%) scale(1.06) !important; box-shadow: 0 8px 25px rgba(0,0,0,0.22); }
.il b { color: var(--acc); font-family: Georgia, serif; font-style: italic; font-size: 13px; }
.il.sel { background: var(--ink); color: #fff; box-shadow: 0 8px 25px rgba(0,0,0,0.35); }
.il.sel b { color: #f59e0b; }
.il.dim { opacity: 0.65; }

.court-lbl { pointer-events: auto; cursor: pointer; background: rgba(15, 23, 42, 0.88); backdrop-filter: blur(8px); color: #fef08a; border: 1px solid rgba(16, 185, 129, 0.6) !important; border-radius: 999px; padding: 5px 15px; font-size: 12px; font-weight: 800; letter-spacing: 0.06em; box-shadow: 0 6px 20px rgba(0,0,0,0.3); display: inline-flex; align-items: center; gap: 7px; }
.court-lbl:hover { transform: translate(-50%, -55%) scale(1.06) !important; background: #1e293b; }

.pin { cursor: pointer; display: inline-flex; align-items: center; gap: 6px; background: var(--card-bg); backdrop-filter: blur(6px); border: 1.5px solid var(--hot) !important; border-radius: 99px; padding: 3px 11px 3px 4px; font-size: 12px; font-weight: 700; box-shadow: 0 4px 15px rgba(0,0,0,0.15); }
.pin:hover { transform: translate(-50%, -56%) scale(1.06) !important; z-index: 10; }
.pin b { display: grid; place-items: center; width: 19px; height: 19px; border-radius: 50%; background: var(--hot); color: #fff; font-size: 10px; }
.pin.on { background: var(--ink); color: #fff; border-color: var(--ink) !important; z-index: 11; }
.pin.read { border-color: #60a5fa !important; }
.pin.done { border-color: #10b981 !important; background: #ecfdf5; color: #064e3b; }
.pin.done b { background: #10b981; }
.pin.read b { background: #60a5fa; }

@keyframes pinBounce { 0%, 100% { transform: translate(-50%, -50%) scale(1); box-shadow: 0 4px 15px rgba(0,0,0,0.15); } 50% { transform: translate(-50%, -85%) scale(1.15); box-shadow: 0 15px 25px rgba(16, 185, 129, 0.4); } }
.pin.match { animation: pinBounce 0.8s infinite; border-color: #10b981 !important; background: #ecfdf5; z-index: 20; }
.pin.match b { background: #10b981; }

.tag { background: var(--card-bg); backdrop-filter: blur(4px); color: var(--ink); border-radius: 99px; padding: 3px 10px; font-size: 11px; font-weight: 700; box-shadow: 0 3px 12px rgba(0, 0, 0, 0.15); cursor: pointer; border: 1px solid var(--line); }
.tag b { color: var(--hot); }
.route { display: flex; align-items: center; gap: 8px; background: var(--soft); border-radius: 14px; padding: 10px; margin: 10px 0; flex-wrap: wrap; }
.chip { all: unset; box-sizing: border-box; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; padding: 5px 12px 5px 6px; border-radius: 999px; background: var(--soft); border: 1px solid var(--line); font-size: 12px; font-weight: 600; }
.chip b { background: var(--hot); color: #fff; border-radius: 999px; padding: 0 7px; font-size: 10px; }
.chip:hover { border-color: var(--acc); }

.brand { position: absolute; left: 20px; top: 20px; z-index: 3; display: flex; align-items: center; gap: 14px; background: var(--panel); backdrop-filter: blur(12px); border: 1px solid var(--line); border-radius: 20px; padding: 12px 22px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1); }
.brand .big { font: 900 22px/1.05 "Arial Black", sans-serif; background: linear-gradient(135deg, #10b981, #3b82f6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.brand h1 { margin: 0; font-size: 15px; font-weight: 800; letter-spacing: 0.08em; }
.brand p { margin: 2px 0 0; font-size: 11px; font-weight: 700; color: var(--mute); }

.tools { position: absolute; right: 20px; top: 20px; display: flex; gap: 8px; z-index: 4; }
.tb { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 10px 16px; cursor: pointer; font-weight: 700; box-shadow: 0 4px 16px rgba(0,0,0,0.08); }
.tb:hover { background: var(--card-bg); transform: translateY(-1px); border-color: var(--acc); }
#menu { display: none; }

.hud { position: absolute; left: 50%; top: 20px; transform: translateX(-50%); display: flex; gap: 10px; z-index: 3; }
.seg { display: flex; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 4px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
.seg button { border: 0; background: transparent; border-radius: 999px; min-width: 42px; height: 38px; padding: 0 12px; cursor: pointer; font-size: 11px; font-weight: 700; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.15; gap: 2px; }
.seg button[aria-pressed=true], .seg button.on { background: var(--ink); color: #fff; }
.seg button.safe.on { background: #10b981; }
.seg button.danger.on { background: #ef4444; }
.seg button.walk-on { background: linear-gradient(135deg, #3b82f6, #8b5cf6) !important; color: #fff; box-shadow: 0 4px 15px rgba(59, 130, 246, 0.5); transform: scale(1.05); }

#card { position: absolute; left: 20px; top: 112px; bottom: 190px; width: 350px; z-index: 5; background: var(--panel); backdrop-filter: blur(16px); border: 1px solid var(--line); border-radius: 24px; box-shadow: 0 20px 50px rgba(0,0,0,0.18); display: flex; flex-direction: column; }
#card[hidden] { display: none; }
#cc { overflow: auto; padding: 24px 20px 40px; flex: 1; scrollbar-width: thin; }
#cx { position: absolute; right: 12px; top: 10px; border: 0; background: var(--soft); width: 30px; height: 30px; border-radius: 50%; font-size: 18px; cursor: pointer; color: var(--mute); z-index: 2; display: grid; place-items: center; }
#cx:hover { background: var(--line); color: var(--ink); }
.ch { display: flex; gap: 14px; align-items: center; padding-right: 28px; margin-bottom: 12px; }
.ch h2 { margin: 2px 0 0; font-size: 20px; line-height: 1.3; font-weight: 800; }
.tile { flex: 0 0 54px; height: 54px; border-radius: 16px; display: grid; place-items: center; background: var(--soft); font-size: 26px; box-shadow: inset 0 0 0 1px var(--line); }
.eb { font: 700 10px ui-monospace, monospace; letter-spacing: 0.16em; color: var(--hot); }
.lede { margin: 6px 0 14px; font-size: 13.5px; }
.say { background: var(--soft); border-left: 3.5px solid var(--hot); border-radius: 12px; padding: 12px 14px; margin: 10px 0 14px; font-size:13px; }
.say b { display: block; color: var(--hot); margin-bottom: 2px; }
.blk { margin: 0 0 14px; }
.blk h4 { margin: 0 0 4px; color: var(--acc); font-size: 13px; font-weight: 800; }
.blk p { margin: 0; font-size:13px;}
.real-case { background: rgba(59, 130, 246, 0.08); border-left: 3.5px solid #3b82f6; border-radius: 8px; padding: 10px 14px; margin: 14px 0 10px; font-size: 12px; font-weight:700; }
.real-case b { color: #2563eb; font-size: 11px; letter-spacing: 0.05em; display:block; margin-bottom: 2px;}

.sim-opt { width: 100%; display: flex; flex-direction: column; align-items: flex-start; gap: 4px; padding: 12px 16px; background: #fff; border: 2px solid var(--line); border-radius: 12px; cursor: pointer; margin-bottom: 10px; transition: all 0.2s; box-sizing: border-box;}
.sim-opt:hover { border-color: #3b82f6; background: #eff6ff; transform: translateX(4px); }
.sim-opt b { font-size: 14px; color: #1e40af; }
.sim-opt span { font-size: 11px; color: var(--mute); text-align: left; line-height: 1.4; }

.tracker { position: absolute; left: 20px; bottom: 20px; z-index: 5; background: rgba(15, 23, 42, 0.9); border: 1px solid rgba(255,255,255,0.15); border-radius: 16px; padding: 16px 20px; width: 250px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); backdrop-filter: blur(12px); color: #fff; }
.tr-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
.tr-top b { font-size: 13px; font-weight: 800; color: #9ca3af; }
.tr-top span { color: #10b981; font-size: 18px; font-weight: 900; font-family: ui-monospace, monospace; }
.tr-bar { background: rgba(255,255,255,0.2); height: 6px; border-radius: 3px; overflow: hidden; margin-bottom: 12px; }
.tr-bar:last-child { margin-bottom: 0; }
#tr-fill { background: linear-gradient(90deg, #10b981, #34d399); height: 100%; width: 0%; transition: width 0.4s ease; }

.sim-btn { position: absolute; right: 20px; bottom: 20px; z-index: 5; background: linear-gradient(135deg, #10b981, #059669); color: white; border: 0; border-radius: 16px; padding: 16px 24px; font-size: 16px; font-weight: 800; cursor: pointer; box-shadow: 0 8px 25px rgba(16, 185, 129, 0.4); display: flex; align-items: center; gap: 8px; transition: transform 0.2s; }
.sim-btn:hover { transform: translateY(-3px) scale(1.02); box-shadow: 0 12px 30px rgba(16, 185, 129, 0.6); }

#sb { background: var(--panel-solid); border-left: 1px solid var(--line); overflow: auto; padding: 28px 24px 32px; position: relative; z-index: 6; }
#sb h2 { font-size: 26px; margin: 4px 0 6px; line-height: 1.25; font-weight: 900; }
.search { width: 100%; box-sizing: border-box; font: inherit; padding: 11px 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--soft); color: var(--ink); margin-bottom: 12px; outline: none; }
.search:focus { border-color: var(--acc); background: var(--panel-solid); }
.tabs { display: flex; gap: 8px; margin-bottom: 14px; }
.tabs button { flex: 1; border: 1px solid var(--line); background: var(--panel-solid); border-radius: 12px; padding: 9px; cursor: pointer; font-size: 12.5px; font-weight: 700; }
.tabs button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
details { border-bottom: 1px solid var(--line); }
summary { list-style: none; display: flex; align-items: center; gap: 12px; padding: 13px 8px; cursor: pointer; border-radius: 12px; }
summary:hover { background: var(--soft); }
summary::-webkit-details-marker { display: none; }
summary b { font: italic 700 20px Georgia, serif; color: var(--acc); width: 28px; }
summary span { flex: 1; font-weight: 800; font-size: 14px; }
details.cur { background: #ecfdf5; border-radius: 14px; border-left: 4px solid var(--acc); margin: 4px 0; border-bottom: 0; }
.kids { display: grid; gap: 4px; padding: 0 8px 14px 38px; }
.kids button { all: unset; cursor: pointer; padding: 7px 10px; border-radius: 8px; font-size: 13px; display: flex; align-items: center; gap: 8px; }
.kids button:hover { background: var(--soft); }
.kids .go { color: var(--acc); font-weight: 700; margin-bottom: 2px; }
.kids .no { display: inline-grid; place-items: center; width: 19px; height: 19px; border-radius: 50%; background: var(--card-bg); color: var(--acc); font-size: 11px; font-weight: 700; flex: none; border: 1px solid var(--line); }
.fi { all: unset; box-sizing: border-box; display: block; width: 100%; cursor: pointer; padding: 12px 8px; border-bottom: 1px solid var(--line); border-radius: 8px; font-size: 13px; }
.fi:hover { background: var(--soft); }
.fi b { color: var(--acc); margin-right: 8px; }
.rows { display: flex; flex-direction: column; gap: 8px; }
.row { all: unset; box-sizing: border-box; display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px 14px; background: var(--soft); border: 1px solid var(--line); border-radius: 14px; cursor: pointer; font-size: 13px; }
.row:hover { border-color: var(--acc); background: var(--card-bg); transform: translateX(2px); }
.row .rt { flex: 1; font-weight: 700; }
.row small { display: block; font-size: 11px; color: var(--mute); font-weight: 400; margin-top: 2px; }
.row em { font-style: normal; font-weight: 700; color: #10b981; }
.btn { font: inherit; font-weight: 700; background: var(--hot); color: #fff; border: 0; border-radius: 12px; padding: 10px 18px; cursor: pointer; box-shadow: 0 4px 12px rgba(234, 88, 12, 0.25); }
.btn:hover { opacity: 0.92; transform: translateY(-1px); }
.btn.g { background: none; color: var(--hot); padding: 2px 0; margin-bottom: 6px; box-shadow: none; }
.sbx { display: none; }
.pills { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
.pill { border-radius: 999px; padding: 3px 10px; font-size: 11px; font-weight: 600; background: var(--soft); border: 1px solid var(--line); }

@media (max-width: 820px) {
  .app { grid-template-columns: 1fr; }
  #menu { display: inline-block; }
  #sb { position: fixed; left: 0; right: 0; bottom: 0; height: 58vh; border-radius: 24px 24px 0 0; border-left: 0; box-shadow: 0 -10px 35px rgba(0,0,0,.28); transform: translateY(105%); transition: transform .35s cubic-bezier(0.16, 1, 0.3, 1); }
  #sb.open { transform: none; }
  #card { left: 10px; right: 10px; width: auto; top: auto; bottom: 0; height: 55%; border-radius: 24px 24px 0 0; z-index: 7; }
  .tracker { bottom: 85px; left: 10px; width: calc(100% - 20px); }
  .sim-btn { bottom: 20px; left: 10px; right: 10px; width: auto; justify-content: center; }
  .sbx { display: block; position: absolute; right: 16px; top: 12px; border: 0; background: none; font-size: 22px; cursor: pointer; color: var(--mute); }
}

/* ---- UI fixes ---- */
.topbar { position: absolute; left: 16px; right: 16px; top: 16px; z-index: 4; display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-start; justify-content: space-between; pointer-events: none; }
.topbar > * { pointer-events: auto; }
.brand, .hud, .tools { position: static; transform: none; }
.brand { padding: 8px 18px; gap: 12px; }
.brand .big { font-size: 18px; }
.hud { order: 2; margin: 0 auto; }
.tools { order: 3; }
.seg button { min-width: 54px; font-size: 11px; }
.seg button i { font-style: normal; font-size: 16px; }
@media (max-width: 1280px) { .brand p { display: none; } }
.il .dot, .row .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.il small { font-size: 11px; font-weight: 700; color: var(--mute); }
.il.sel small { color: #d1d5db; }
#sb h3 { font-size: 14px; margin: 18px 0 8px; }
.pgl { display: flex; align-items: center; font-weight: 700; font-size: 13px; margin-bottom: 12px; }
.pgbox { background: var(--soft); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; margin-bottom: 4px; }
.pgbig { display: flex; align-items: baseline; gap: 6px; font-size: 34px; font-weight: 900; margin-bottom: 8px; }
.pgbig small { font-size: 13px; color: var(--mute); font-weight: 700; }
.pgbig span { margin-left: auto; color: var(--acc); }
.pgbar { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; margin-top: 4px; }
.pgbar i { display: block; height: 100%; border-radius: 4px; transition: width .4s; }
.pgact { display: flex; gap: 8px; margin: 18px 0 8px; }
.zp { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; background: var(--soft); border-radius: 12px; padding: 10px 12px; margin: 0 0 14px; font-size: 12.5px; font-weight: 700; }
.zp input { flex: 1; min-width: 120px; font: inherit; padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel-solid); color: var(--ink); }
button:focus-visible, input:focus-visible { outline: 2px solid #3b82f6; outline-offset: 2px; }
.cno { flex: none; min-width: 34px; font: 700 12px ui-monospace, monospace; color: var(--acc); }
.pin.na { opacity: .5; }
.zp select { font: inherit; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel-solid); color: var(--ink); margin-right: 10px; }
.drop { border: 2px dashed var(--line); border-radius: 14px; padding: 18px; text-align: center; font-size: 13px; margin: 12px 0; display: grid; gap: 4px; }
.drop.on { border-color: var(--acc); background: #ecfdf5; }
.drop .lk { color: #3b82f6; font-weight: 700; cursor: pointer; }
.drop small { color: var(--mute); }
.fi2 { display: flex; align-items: center; gap: 8px; padding: 8px 4px; border-bottom: 1px solid var(--line); font-size: 13px; }
.fi2 .fe { font-size: 20px; }
.fi2 .fn { flex: 1; min-width: 0; }
.fi2 .fn b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fi2 small { display: block; color: var(--mute); font-size: 11px; }
.fi2 small a { color: #3b82f6; cursor: pointer; margin-right: 6px; }
.mini { border: 1px solid var(--line); background: var(--panel-solid); border-radius: 8px; padding: 4px 8px; font-size: 12px; cursor: pointer; }
.ck { display: grid; gap: 2px; padding: 2px 6px 8px; font-size: 12.5px; }
.ck label { cursor: pointer; }

/* ---- 認真模式 (Dashboard Mode) ---- */
body.serious-mode .app { display: block; }
body.serious-mode #stage { display: none; }
body.serious-mode #sb { height: 100vh; max-width: 100%; border-left: none; padding: 40px; transform: none; box-shadow: none; border-radius: 0; }
body.serious-mode #sb h2 { font-size: 32px; }
body.serious-mode .tabs button { font-size: 16px; padding: 12px; }
body.serious-mode .rows { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 12px; }
</style>
</head>
<body>
<!-- 登入視窗 -->
<div id="loginOverlay" style="position:fixed;inset:0;background:var(--panel);z-index:9999;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(10px);">
  <div style="background:var(--card-bg);padding:40px;border-radius:24px;box-shadow:0 20px 50px rgba(0,0,0,0.2);width:320px;text-align:center;border:1px solid var(--line);">
    <h2 style="margin:0 0 10px;font-size:24px;">資安島 登入</h2>
    <p style="margin:0 0 20px;color:var(--mute);font-size:13px;">ISO 27001 合規戰情室</p>
    <input id="loginUser" placeholder="帳號 (例: admin)" class="search" style="margin-bottom:10px;background:#fff;">
    <input id="loginPwd" type="password" placeholder="密碼 (例: 123)" class="search" style="margin-bottom:15px;background:#fff;" onkeydown="if(event.key==='Enter') doLogin()">
    <button class="sim-btn" style="position:static;width:100%;justify-content:center;padding:12px;" onclick="doLogin()">登入系統</button>
    <p id="loginErr" style="color:#ef4444;font-size:13px;margin-top:12px;display:none;font-weight:700;">帳號或密碼錯誤</p>
    <div style="margin-top:20px;font-size:12px;color:var(--mute);text-align:left;background:var(--soft);padding:12px;border-radius:12px;">
      <b style="color:var(--ink)">測試帳號 (密碼皆為 123)：</b><br>
      <div style="margin-top:6px; line-height:1.6">
        • <b>admin</b> (管理員：可編輯全部)<br>
        • <b>audit</b> (稽核員：僅可標記缺失)<br>
        • <b>user</b> (使用者：唯讀模式)
      </div>
    </div>
  </div>
</div>

<main class="app">
  <section id="stage">
    <div id="lab"></div>
    <header class="topbar">
    <div class="brand">
      <div class="big">ISO 27001<br>ISLAND.</div>
      <div><h1>資安合規防護網</h1><p><span>SIMULATOR</span> 資安導入模擬器</p></div>
    </div>
    <div class="tools">
      <button class="tb" id="home">↗ 全景</button>
      <button class="tb" id="courtBtn">🏛️ 驗證機構</button>
      <button class="tb" id="modeBtn">📊 認真模式</button>
      <button class="tb" id="menu">≡ 索引 / 進度</button>
    </div>
    <div class="hud">
      <div class="seg" id="tm">
        <button data-t="safe" class="safe on" title="合規安全"><i>🛡️</i>合規</button>
        <button data-t="flat" class="" title="營運中"><i>⚖️</i>營運</button>
        <button data-t="danger" class="danger" title="資安危機"><i>🚨</i>危機</button>
      </div>
      <div class="seg" id="tg">

  }
  function showTpForm(sel) {
    $("#tpForm").innerHTML = `<div class="zp" style="display:block"><b>${TS.edit ? "修改對應的控制措施" : "上傳：" + TS.pend.map(f => esc(f.name)).join("、")}</b><div style="margin:8px 0">${Zs.map((z, i) => `<details><summary style="padding:6px 4px">${z.e} ${z.n}</summary><div class="ck">${N.filter(n => n.z === i).map(n => `<label><input type="checkbox" value="${n.no}" ${sel.includes(n.no) ? "checked" : ""}> ${dn(n.no)} ${n.ti}</label>`).join("")}</div></details>`).join("")}</div><button class="btn" onclick="tpSave()">${TS.edit ? "儲存" : "上傳"}</button> <button class="btn" style="background:#9ca3af" onclick="document.getElementById('tpForm').innerHTML=''">取消</button></div>`;
    $("#tpForm").scrollIntoView({ block: "nearest" });
  }
  async function loadTpl() { try { TL = await TPL.list(); } catch (e) { TL = []; } renderTp(); refresh(); }
  const tryDo = async fn => { try { await fn(); } catch (e) { alert("操作失敗：" + (e && e.message || e) + "\n（若在沙盒或 file:// 環境，瀏覽器可能不允許儲存檔案）"); } };
  window.renderTplBox = no => {
    const bx = $("#tplBox"); if (!bx) return;
    const mine = TL.filter(f => f.ctl.includes(no)), other = TL.filter(f => !f.ctl.includes(no)), ed = canUp();
    
    // 缺失追蹤下拉選單 (放置在卡片中的 zp 區塊內)
    const ncSelectHTML = `
      <select ${canAudit() ? "" : "disabled"} onchange="setNC('${no}', this.value)" style="margin-left:8px; border-color:${ncOf(no) > 1 ? '#ef4444' : 'var(--line)'}; color:${ncOf(no) > 1 ? '#ef4444' : 'inherit'}">
        ${["無稽核缺失", "觀察事項 (OFI)", "次要缺失 (Minor NC)", "主要缺失 (Major NC)"].map((t, k) => `<option value="${k}" ${ncOf(no) === k ? "selected" : ""}>${t}</option>`).join("")}
      </select>
    `;
    
    const zpBox = document.querySelector("#cc .zp");
    if (zpBox && !zpBox.querySelector("select[onchange^='setNC']")) {
       const selectNode = document.createElement("div");
       selectNode.style.display = "inline-block";
       selectNode.innerHTML = ncSelectHTML;
       zpBox.insertBefore(selectNode.firstElementChild, zpBox.querySelector("label"));
    }

    bx.innerHTML = (mine.map(f => `<div class="fi2"><span class="fe">${ico(f.name)}</span><div class="fn"><b>${esc(f.name)}</b><small>${fmtSz(f.size)}</small></div><button class="mini" onclick="tpGet('${f.id}')">下載</button>${ed ? `<button class="mini" onclick="tpUnlink('${f.id}', '${no}')">移除</button>` : ""}</div>`).join("") || "<p class='mute' style='margin:0 0 8px'>尚未放入模板。</p>")
      + (ed ? `<label class="btn" style="background:#3b82f6; display:inline-block; cursor:pointer;">＋ 上傳模板<input type="file" multiple hidden onchange="tpUp(this.files, '${no}')"></label>${other.length ? `<select onchange="tpLinkOne(this.value, '${no}')" style="margin-left:6px; max-width:150px;"><option value="">連結既有…</option>${other.map(f => `<option value="${f.id}">${esc(f.name)}</option>`).join("")}</select>` : ""}` : "");
  };
  window.tpPick = fs => { TS.pend = [...fs]; TS.edit = null; if (TS.pend.length) showTpForm([]); };
  window.tpEdit = id => { TS.edit = id; TS.pend = []; showTpForm(TL.find(f => f.id === id).ctl); };
  window.tpSave = () => tryDo(async () => { const ctl = [...document.querySelectorAll("#tpForm input:checked")].map(i => i.value); if (TS.edit) await TPL.link(TS.edit, ctl); else for (const f of TS.pend) await TPL.add(f, ctl); TS.pend = []; TS.edit = null; await loadTpl(); });
  window.tpDel = id => { if (confirm("確定刪除這份模板？")) tryDo(async () => { await TPL.del(id); await loadTpl(); }); };
  window.tpGet = id => tryDo(() => TPL.get(id));
  window.tpUp = (fs, no) => tryDo(async () => { for (const f of fs) await TPL.add(f, [no]); await loadTpl(); renderTplBox(no); });
  window.tpUnlink = (id, no) => tryDo(async () => { await TPL.link(id, TL.find(f => f.id === id).ctl.filter(c => c !== no)); await loadTpl(); renderTplBox(no); });
  window.tpLinkOne = (id, no) => { if (id) tryDo(async () => { await TPL.link(id, [...TL.find(f => f.id === id).ctl, no]); await loadTpl(); renderTplBox(no); }); };
  window.openCtl = no => pins[N.find(n => n.no === no).id].onclick();
  function refresh() {
    zBeacons.forEach((bc, i) => { const c = zState(i).c; bc.material.color.set(c); bc.material.emissive.set(c); });
    sync(); renderPg();
    const t = totDone(), all = totAll() || 1; $("#realLabel").innerText = `輔導完成度：${t}/${totAll()} 項（${Math.round(t * 100 / all)}%）`; $("#tr-fill2").style.width = `${t * 100 / all}%`;
  }
  window.pgSet = (k, v) => { if (!canEdit()) return; P[k] = v; saveP(); refresh(); };
  window.pgOwn = (i, v) => { if (!canEdit()) return; P.own[i] = v; saveP(); refresh(); };
  window.setSt = (no, v) => { if (!canEdit()) return; P.st[no] = +v; saveP(); refresh(); };
  window.setNA = (no, c) => { if (!canEdit()) return; if (c) P.na[no] = true; else delete P.na[no]; saveP(); refresh(); };
  window.setWhy = (no, v) => { if (!canEdit()) return; P.why[no] = v; saveP(); };
  window.pgExp = () => { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([JSON.stringify(P, null, 1)], { type: "application/json" })); a.download = "progress.json"; a.click(); };
  window.pgImp = () => { const f = document.createElement("input"); f.type = "file"; f.accept = ".json"; f.onchange = () => f.files[0].text().then(t => { Object.assign(P, JSON.parse(t)); saveP(); refresh(); }); f.click(); };
  window.pgReset = () => { if (canEdit() && confirm("確定清除所有實作狀態、排除理由與負責人？")) { P.st = {}; P.na = {}; P.why = {}; P.own = {}; P.nc = {}; saveP(); refresh(); } };
  window.pgSoA = () => {
    const q = s => '"' + String(s == null ? "" : s).replace(/"/g, '""') + '"', ST = ["未開始", "進行中", "已完成"], NC_ST = ["無缺失", "OFI", "Minor NC", "Major NC"];
    const rows = [["條次", "措施（中文）", "English", "主題", "所屬島", "2022新增", "適用", "排除理由", "實作狀態", "稽核缺失", "負責人", "模板檔案", "建議文件／紀錄"]];
    N.filter(n => !n.cl).forEach(n => { const na = isNA(n.no); rows.push([n.no, n.ti, n.en, n.th, Zs[n.z].n, n.nw ? "是" : "", na ? "否" : "是", na ? P.why[n.no] : "", na ? "" : ST[stOf(n.no)], NC_ST[ncOf(n.no)], P.own[n.z] || "", TL.filter(f => f.ctl.includes(n.no)).map(f => f.name).join("；"), n.ev]); });
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob(["\ufeff" + rows.map(r => r.map(q).join(",")).join("\r\n")], { type: "text/csv" })); a.download = `SoA_${P.client || "ISO27001"}.csv`; a.click();
  };
  
  sb.querySelector(".tabs").onclick = e => { const bt = e.target.closest("button"); if (!bt) return; sb.querySelectorAll(".tabs button").forEach(x => x.classList.toggle("on", x === bt)); ["Pg", "Tp", "Idx"].forEach(k => $("#tab" + k).hidden = bt.dataset.tab !== k.toLowerCase()); };
  
  async function init() {
    // 讀取外部 users.json (若存在則覆蓋內建假資料)
    try { const ur = await fetch("users.json", { cache: "no-store" }); if (ur.ok) { const j = await ur.json(); if(Array.isArray(j)) USERS = j; } } catch (e) {}
    
    // 強制設定為靜態網頁模式
    TS.mode = "static";
    
    try { const r = await fetch("progress.json", { cache: "no-store" }); if (r.ok) { const j = await r.json(); if (j && j.ts > P.ts) Object.assign(P, j); } } catch (e) {}
    await loadTpl();
  }
  renderTp();
  init(); // 先載入資料但不執行 refresh (登入後才會顯示)
  requestAnimationFrame(loop);
}
</script>
</body>
</html>
