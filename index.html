<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ISO 27001 資安島｜登入</title>
<link rel="stylesheet" href="style.css">
<style>
  body { overflow: auto; display: grid; place-items: center; min-height: 100vh; background: linear-gradient(160deg, #38bdf8 0%, #e0f2fe 55%, #fdfbf7 100%); }
  .lg { background: var(--card-bg); padding: 40px; border-radius: 24px; box-shadow: 0 20px 50px rgba(0,0,0,.2); width: 340px; max-width: 92vw; text-align: center; border: 1px solid var(--line); backdrop-filter: blur(10px); }
  .lg h2 { margin: 0 0 6px; font-size: 26px; } .lg p { margin: 0 0 20px; color: var(--mute); font-size: 13px; }
  .lg .search { margin-bottom: 10px; background: #fff; width: 100%; box-sizing: border-box; }
  #loginErr { color: #ef4444; font-size: 13px; margin-top: 12px; display: none; font-weight: 700; }
  #hint { display: none; margin-top: 20px; font-size: 12px; color: var(--mute); text-align: left; background: var(--soft); padding: 12px; border-radius: 12px; line-height: 1.7; }
</style>
</head>
<body data-page="login">
<div class="lg">
  <h2>資安島 登入</h2>
  <p>ISO 27001 合規戰情室</p>
  <input id="loginUser" class="search" placeholder="帳號" autocomplete="username">
  <input id="loginPwd" type="password" class="search" placeholder="密碼" autocomplete="current-password" onkeydown="if(event.key==='Enter') doLogin()">
  <button class="sim-btn" style="position:static;width:100%;justify-content:center;padding:12px;margin-top:5px" onclick="doLogin()">登入系統</button>
  <div id="loginErr">帳號或密碼錯誤</div>
  <div id="hint"><b style="color:var(--ink)">找不到 users.json，使用預設帳號：</b><br>
    • <b>admin</b>（管理員 → 儀表板）<br>• <b>audit</b>（稽核員 → 儀表板）<br>• <b>user</b>（一般員工 → 3D 島嶼）<br>密碼皆為 123</div>
</div>
<div id="diag" style="position:fixed;left:10px;bottom:8px;font:11px/1.5 monospace;color:#475569"></div>
<script>
  // 先建立登入函式，就算 app.js 載入失敗，按鈕也會顯示原因而不是沒反應
  var showMsg = function (t) { var e = document.getElementById("loginErr"); e.textContent = t; e.style.display = "block"; };
  window.addEventListener("error", function (e) { if (e.message && e.message !== "Script error.") showMsg("程式錯誤：" + e.message); });
  window.doLogin = function () {
    if (typeof loadUsers !== "function") return showMsg("app.js 沒有載入成功。請確認 app.js 和 index.html 在同一層、已 push，並用 Cmd+Shift+R 重新整理。");
    try {
      var u = document.getElementById("loginUser").value.trim(), p = document.getElementById("loginPwd").value;
      var m = USERS.find(function (x) { return x.u === u && x.p === p; });
      if (!m) return showMsg("帳號或密碼錯誤" + (USERS_LOADED ? "" : "（目前使用預設帳號，密碼是 123；users.json 沒讀到）"));
      sessionStorage.setItem("iso_session", JSON.stringify({ u: m.u, r: m.r, name: m.name }));
      goHome(m);
    } catch (err) { showMsg("登入失敗：" + err.message); }
  };
  var goHome = function (u) { location.href = (u.r === "admin" || u.r === "auditor") ? "dashboard.html" : "island.html"; };
</script>
<script src="app.js"></script>
<script>
  var d = document.getElementById("diag");
  if (typeof loadUsers !== "function") { d.textContent = "app.js ✖ 未載入"; }
  else {
    d.textContent = "app.js ✔";
    loadUsers().then(function (ok) { d.textContent += "　users.json " + (ok ? "✔" : "✖（使用預設帳號）"); if (!ok) document.getElementById("hint").style.display = "block"; });
    if (currentUser) goHome(currentUser);
  }
</script>
</body>
</html>
